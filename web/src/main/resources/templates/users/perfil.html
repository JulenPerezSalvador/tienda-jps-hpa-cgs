<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head th:replace="~{fragments/head :: head-comun(titulo='JPS-HPA-CGS | Mi Perfil')}"></head>
<body>
<div th:replace="~{fragments/navegacion :: menu-principal}"></div>

<main class="py-5">
    <div class="container py-3">
        <div class="row justify-content-center">
            <div class="col-md-7">

                <div class="text-center mb-5">
                    <h6 class="text-uppercase" style="letter-spacing: 4px; color: #8e8e8e; font-size: 0.7rem;">
                        Cuenta
                    </h6>
                    <h2 style="font-family: 'Cormorant Garamond', serif; font-style: italic;">
                        Perfil de Usuario
                    </h2>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">

                        <div class="row mb-3">
                            <div class="col-sm-4 text-muted small text-uppercase"
                                 style="letter-spacing: 1px; font-size: 0.65rem;">Nombre completo</div>
                            <div class="col-sm-8 fw-light"
                                 th:text="${usuario.nombre + ' ' + usuario.apellidos}"></div>
                        </div>
                        <hr class="my-2">

                        <div class="row mb-3">
                            <div class="col-sm-4 text-muted small text-uppercase"
                                 style="letter-spacing: 1px; font-size: 0.65rem;">Correo electrónico</div>
                            <div class="col-sm-8 fw-light" th:text="${usuario.email}"></div>
                        </div>
                        <hr class="my-2">

                        <div class="row mb-3" th:if="${usuario.telefono != null and !usuario.telefono.isEmpty()}">
                            <div class="col-sm-4 text-muted small text-uppercase"
                                 style="letter-spacing: 1px; font-size: 0.65rem;">Teléfono</div>
                            <div class="col-sm-8 fw-light" th:text="${usuario.telefono}"></div>
                        </div>

                        <div class="row mb-3" th:if="${usuario.fechaNacimiento != null}">
                            <div class="col-sm-4 text-muted small text-uppercase"
                                 style="letter-spacing: 1px; font-size: 0.65rem;">Fecha de nacimiento</div>
                            <div class="col-sm-8 fw-light"
                                 th:text="${#temporals.format(usuario.fechaNacimiento, 'dd/MM/yyyy')}"></div>
                        </div>

                        <hr class="my-2">
                        <div class="row mb-3">
                            <div class="col-sm-4 text-muted small text-uppercase"
                                 style="letter-spacing: 1px; font-size: 0.65rem;">Miembro desde</div>
                            <div class="col-sm-8 fw-light"
                                 th:text="${#temporals.format(usuario.fechaRegistro, 'dd/MM/yyyy HH:mm')}"></div>
                        </div>

                        <hr class="my-2">
                        <div class="row mb-3">
                            <div class="col-sm-4 text-muted small text-uppercase"
                                 style="letter-spacing: 1px; font-size: 0.65rem;">Roles</div>
                            <div class="col-sm-8">
                                <span th:each="rol : ${usuario.roles}"
                                      class="badge bg-dark me-1 text-uppercase"
                                      style="letter-spacing: 1px; font-size: 0.6rem;"
                                      th:text="${rol.descripcion}"></span>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Acceso rápido a administración solo para ADMIN -->
                <div class="text-center mt-4" sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin}" class="btn btn-sm btn-outline-dark text-uppercase"
                       style="letter-spacing: 2px; font-size: 0.7rem;">
                        Ir al Panel de Administración
                    </a>
                </div>

                <div class="text-center mt-3">
                    <a th:href="@{/}" class="text-muted small">← Volver a la tienda</a>
                </div>

            </div>
        </div>
    </div>
</main>

<footer class="text-center py-4 border-top">
    <p class="small text-uppercase mb-0" style="letter-spacing: 3px; color: #aaa;">
        &copy; 2026 JPS-HPA-CGS Global
    </p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
