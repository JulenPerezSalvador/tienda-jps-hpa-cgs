<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administración de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Listado de Productos</h2>
        <div>
            <a th:href="@{/admin}" class="btn btn-secondary me-2">Volver</a>
            <a th:href="@{/admin/productos/crear}" class="btn btn-success">Nuevo Producto</a>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Marca</th>
                    <th>Precio</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${productos}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.marca != null ? p.marca.nombre : 'Sin marca'}"></td>
                    <td th:text="${p.precio + ' €'}"></td>
                    <td class="text-center">
                        <a th:href="@{/admin/productos/editar/{id}(id=${p.id})}" class="btn btn-sm btn-warning">Editar</a>
                        <a th:href="@{/admin/productos/borrar/{id}(id=${p.id})}" class="btn btn-sm btn-danger">Borrar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
