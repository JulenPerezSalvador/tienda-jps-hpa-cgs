<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand">Tienda - Administración</span>
        <a th:href="@{/}" class="btn btn-outline-light btn-sm">Volver a la Tienda</a>
    </div>
</nav>
<main class="container text-center">
    <h1>Gestión de la Tienda</h1>
    <div class="row mt-4">
        <div class="col-md-4"><div class="card p-3 shadow-sm"><h3>Marcas</h3><a th:href="@{/admin/marcas}" class="btn btn-primary">Gestionar</a></div></div>
        <div class="col-md-4"><div class="card p-3 shadow-sm"><h3>Categorías</h3><a th:href="@{/admin/categorias}" class="btn btn-primary">Gestionar</a></div></div>
        <div class="col-md-4"><div class="card p-3 shadow-sm"><h3>Productos</h3><a th:href="@{/admin/productos}" class="btn btn-primary">Gestionar</a></div></div>
    </div>
</main>
</body>
</html>
