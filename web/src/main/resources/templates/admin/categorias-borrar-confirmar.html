<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Borrado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5 text-center">
    <div class="card shadow mx-auto" style="max-width: 600px;">
        <div class="card-body p-5">
            <h2 class="text-danger mb-4">Eliminar Categoría</h2>
            <p class="lead mb-5">
                ¿Seguro que desea borrar la categoría <br>
                <strong th:text="${categoria.nombre}">Nombre de la Categoría</strong>?
            </p>
            <form th:action="@{/admin/categorias/borrar/{id}(id=${categoria.id})}" th:method="post">
                <button type="submit" class="btn btn-danger btn-lg px-5 me-3">Aceptar</button>
                <a th:href="@{/admin/categorias}" class="btn btn-secondary btn-lg px-5">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
