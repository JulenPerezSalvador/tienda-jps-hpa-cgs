<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0" th:text="${producto.id == null} ? 'Nueva Producto' : 'Editar Producto'"></h2>
        </div>

        <div class="card-body">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="${producto.id == null} ? @{/admin/productos/crear} : @{/admin/productos/editar/{id}(id=${producto.id})}"
                  th:object="${producto}" method="post">

                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Código EAN-13</label>
                    <input type="text" th:field="*{codigoEan}" class="form-control" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Precio (€)</label>
                        <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Descuento (%)</label>
                        <input type="number" th:field="*{descuento}" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea th:field="*{descripcion}" class="form-control" rows="3" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">URL Imagen</label>
                    <input type="text" th:field="*{imagen}" class="form-control" placeholder="/imagenes/productos/ejemplo.jpg">
                </div>

                <div class="mb-3">
                    <label class="form-label">Marca</label>
                    <select th:field="*{marca.id}" class="form-select" required>
                        <option value="">Selecciona Marca</option>
                        <option th:each="m : ${marcas}" th:value="${m.id}" th:text="${m.nombre}"></option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Categorías</label><br>
                    <div th:each="cat : ${categorias}" class="form-check form-check-inline">
                        <input type="checkbox" th:field="*{categorias}" th:value="${cat.id}" class="form-check-input" th:id="'cat-' + ${cat.id}">
                        <label class="form-check-label" th:for="'cat-' + ${cat.id}" th:text="${cat.nombre}"></label>
                    </div>
                </div>

                <button type="submit" class="btn btn-success">Aceptar</button>
                <a th:href="@{/admin/productos}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
