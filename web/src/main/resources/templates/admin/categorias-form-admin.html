<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Gestión de Categoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light"><div class="container mt-5"><div class="card shadow">
    <div class="card-header bg-primary text-white text-center"><h2 th:text="${categoria.id == null} ? 'Nueva Categoría' : 'Editar Categoría'"></h2></div>
    <div class="card-body">
        <form th:action="${categoria.id == null} ? @{/admin/categorias/crear} : @{/admin/categorias/editar/{id}(id=${categoria.id})}" th:object="${categoria}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3"><label class="form-label">Nombre</label><input type="text" th:field="*{nombre}" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Descripción</label><textarea th:field="*{descripcion}" class="form-control"></textarea></div>
            <div class="mb-3"><label class="form-label">Imagen</label><input type="text" th:field="*{imagen}" class="form-control"></div>
            <button type="submit" class="btn btn-success">Aceptar</button><a th:href="@{/admin/categorias}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div></div></body></html>
