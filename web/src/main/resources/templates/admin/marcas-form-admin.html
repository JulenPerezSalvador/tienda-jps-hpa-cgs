<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Marca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow mx-auto" style="max-width: 500px;">
        <div class="card-header bg-primary text-white text-center">
            <h2 class="mb-0" th:text="${marca.id == null} ? 'Nueva Marca' : 'Editar Marca'"></h2>
        </div>
        <div class="card-body">
            <form th:action="${marca.id == null} ? @{/admin/marcas/crear} : @{/admin/marcas/editar/{id}(id=${marca.id})}" th:object="${marca}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label">Nombre de la Marca</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ej: Levi's">
                </div>
                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-success px-4">Aceptar</button>
                    <a th:href="@{/admin/marcas}" class="btn btn-secondary px-4">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
