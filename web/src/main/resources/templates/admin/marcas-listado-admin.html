<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Marcas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between mb-4">
        <h2>Gestión de Marcas</h2>
        <div>
            <a th:href="@{/admin}" class="btn btn-secondary me-2">Volver</a>
            <a th:href="@{/admin/marcas/crear}" class="btn btn-success">Nueva Marca</a>
        </div>
    </div>
    <table class="table table-bordered bg-white shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th class="text-center">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${marcas}">
            <td th:text="${m.id}"></td>
            <td th:text="${m.nombre}"></td>
            <td class="text-center">
                <a th:href="@{/admin/marcas/editar/{id}(id=${m.id})}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/admin/marcas/borrar/{id}(id=${m.id})}" class="btn btn-sm btn-danger">Borrar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
