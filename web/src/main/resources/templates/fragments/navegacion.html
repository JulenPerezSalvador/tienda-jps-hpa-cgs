<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="menu-principal" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">JPS-HPA-CGS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- Links principales -->
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/categorias}">Colecciones</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/productos}">Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/sobre-nosotros}">La Marca</a>
                </li>
            </ul>

            <!-- Bloque de autenticación -->
            <ul class="navbar-nav ms-auto align-items-center">

                <!-- Usuario AUTENTICADO -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link d-flex align-items-center gap-1" th:href="@{/users/profile}">
                        <span style="font-size:0.85rem;">👤</span>
                        <span class="small text-uppercase" style="letter-spacing:1px; font-size:0.65rem;"
                              sec:authentication="name"></span>
                    </a>
                </li>

                <!-- Separador visual -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="nav-link px-1" style="color: rgba(255,255,255,0.3);">|</span>
                </li>

                <!-- Logout como link (POST via JS) -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" id="logoutForm" class="m-0 p-0">
                        <a href="#" role="button" tabindex="0"
                           aria-label="Cerrar sesión"
                           class="nav-link small text-uppercase"
                           style="letter-spacing:1px; font-size:0.65rem; cursor:pointer;"
                           onclick="document.getElementById('logoutForm').submit(); return false;">
                            Salir
                        </a>
                    </form>
                </li>

                <!-- Usuario NO AUTENTICADO -->
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link small text-uppercase"
                       style="letter-spacing:1px; font-size:0.65rem;"
                       th:href="@{/login}">Iniciar sesión</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <span class="nav-link px-1" style="color: rgba(255,255,255,0.3);">|</span>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link small text-uppercase"
                       style="letter-spacing:1px; font-size:0.65rem;"
                       th:href="@{/register}">Registrarse</a>
                </li>

            </ul>
        </div>
    </div>
</nav>
</body>
</html>
