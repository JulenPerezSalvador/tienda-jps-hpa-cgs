<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head-comun(titulo='JPS-HPA-CGS | Iniciar Sesión')}"></head>
<body>
<div th:replace="~{fragments/navegacion :: menu-principal}"></div>

<main class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">

                <div class="text-center mb-5">
                    <h6 class="text-uppercase" style="letter-spacing: 4px; color: #8e8e8e; font-size: 0.7rem;">
                        Bienvenido de nuevo
                    </h6>
                    <h2 style="font-family: 'Cormorant Garamond', serif; font-style: italic;">
                        Iniciar Sesión
                    </h2>
                </div>

                <!-- Mensaje de error -->
                <div th:if="${error}" class="alert alert-danger text-center small" th:text="${error}"></div>

                <!-- Mensaje de registro exitoso -->
                <div th:if="${registrado}" class="alert alert-success text-center small" th:text="${registrado}"></div>

                <!-- Formulario de login: POST a /login procesado por Spring Security -->
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label small text-uppercase"
                               style="letter-spacing: 2px; font-size: 0.65rem;">
                            Correo electrónico
                        </label>
                        <input type="email" id="username" name="username"
                               class="form-control form-control-sm border-0 border-bottom rounded-0"
                               placeholder="tu@correo.com" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label small text-uppercase"
                               style="letter-spacing: 2px; font-size: 0.65rem;">
                            Contraseña
                        </label>
                        <input type="password" id="password" name="password"
                               class="form-control form-control-sm border-0 border-bottom rounded-0"
                               placeholder="••••••••" required>
                    </div>
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-dark text-uppercase"
                                style="letter-spacing: 3px; font-size: 0.75rem; padding: 12px;">
                            Entrar
                        </button>
                    </div>
                </form>

                <p class="text-center small" style="color: #aaa; font-size: 0.75rem; letter-spacing: 1px;">
                    ¿Aún no tienes cuenta?
                    <a th:href="@{/register}" class="text-dark">Regístrate</a>
                </p>

            </div>
        </div>
    </div>
</main>

<footer class="text-center py-4 border-top">
    <p class="small text-uppercase mb-0" style="letter-spacing: 3px; color: #aaa;">
        &copy; 2026 JPS-HPA-CGS Global
    </p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
