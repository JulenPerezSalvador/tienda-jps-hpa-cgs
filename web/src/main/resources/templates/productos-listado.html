<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head-comun(titulo='Nuestros Productos')}"></head>
<body>
<div th:replace="~{fragments/navegacion :: menu-principal}"></div>

<main class="container my-5">
    <h1 class="text-center mb-5 text-uppercase fw-light">Nuestros Productos</h1>

    <div class="row g-4">
        <div th:each="producto : ${productos}" class="col-12 col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm border-0 product-card">
                <div class="product-image-wrapper">
                    <span th:if="${producto.descuento > 0}" class="badge bg-danger position-absolute top-0 end-0 m-3"
                          th:text="${'-' + producto.descuento + '%'}"></span>

                    <img th:src="@{${producto.imagen != null ? producto.imagen : 'imagenes/categorias/hugo.jpg'}}"
                         class="card-img-top img-producto-card"
                         th:alt="${producto.imagen != null ? 'Imagen de ' + producto.nombre : ''}">
                </div>

                <div class="card-body text-center">
                    <p class="product-category" th:if="${producto.marca != null}" th:text="${producto.marca.nombre}"></p>
                    <h5 class="product-name">
                        <a th:href="@{/productos/{id}/{n}(id=${producto.id}, n=${#strings.replace(#strings.toLowerCase(producto.nombre), ' ', '-')})}"
                           th:text="${producto.nombre}" class="text-decoration-none text-dark"></a>
                    </h5>

                    <p class="fw-bold fs-5">
                        <span th:if="${producto.descuento > 0}">
                            <span class="text-danger" th:text="${#numbers.formatDecimal(producto.precio * (1 - producto.descuento / 100.0), 1, 2)} + ' €'"></span>
                            <small class="text-muted text-decoration-line-through ms-2" th:text="${producto.precio} + ' €'"></small>
                        </span>
                        <span th:if="${producto.descuento == 0}" th:text="${producto.precio} + ' €'"></span>
                    </p>

                    <p class="small text-muted" th:text="${#strings.abbreviate(producto.descripcion, 200)}"></p>

                    <a th:href="@{/productos/{id}/{n}(id=${producto.id}, n=${#strings.replace(#strings.toLowerCase(producto.nombre), ' ', '-')})}"
                       class="btn btn-outline-dark rounded-0 px-4">VER DETALLE</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: pie-pagina}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
