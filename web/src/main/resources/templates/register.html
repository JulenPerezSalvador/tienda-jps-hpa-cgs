<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head-comun(titulo='JPS-HPA-CGS | Crear Cuenta')}"></head>
<body>
<div th:replace="~{fragments/navegacion :: menu-principal}"></div>

<main class="py-5">
    <div class="container py-3">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="text-center mb-5">
                    <h6 class="text-uppercase" style="letter-spacing: 4px; color: #8e8e8e; font-size: 0.7rem;">
                        Únete a nosotros
                    </h6>
                    <h2 style="font-family: 'Cormorant Garamond', serif; font-style: italic;">
                        Crear Cuenta
                    </h2>
                </div>

                <!-- Error global (p.ej. excepción en BD) -->
                <div th:if="${errorGlobal}" class="alert alert-danger small" th:text="${errorGlobal}"></div>

                <form th:action="@{/register}" th:object="${usuarioDTO}" method="post">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small text-uppercase"
                                   style="letter-spacing: 2px; font-size: 0.65rem;">Nombre *</label>
                            <input type="text" th:field="*{nombre}"
                                   class="form-control form-control-sm rounded-0"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                                   placeholder="Tu nombre">
                            <div class="invalid-feedback" th:errors="*{nombre}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small text-uppercase"
                                   style="letter-spacing: 2px; font-size: 0.65rem;">Apellidos *</label>
                            <input type="text" th:field="*{apellidos}"
                                   class="form-control form-control-sm rounded-0"
                                   th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid' : ''"
                                   placeholder="Tus apellidos">
                            <div class="invalid-feedback" th:errors="*{apellidos}"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small text-uppercase"
                               style="letter-spacing: 2px; font-size: 0.65rem;">Correo electrónico *</label>
                        <input type="email" th:field="*{email}"
                               class="form-control form-control-sm rounded-0"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                               placeholder="tu@correo.com">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small text-uppercase"
                               style="letter-spacing: 2px; font-size: 0.65rem;">Contraseña *</label>
                        <input type="password" th:field="*{contrasena}"
                               class="form-control form-control-sm rounded-0"
                               th:classappend="${#fields.hasErrors('contrasena')} ? 'is-invalid' : ''"
                               placeholder="Mínimo 6 caracteres">
                        <div class="invalid-feedback" th:errors="*{contrasena}"></div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small text-uppercase"
                                   style="letter-spacing: 2px; font-size: 0.65rem;">Teléfono (opcional)</label>
                            <input type="tel" th:field="*{telefono}"
                                   class="form-control form-control-sm rounded-0"
                                   placeholder="+34 600 000 000">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small text-uppercase"
                                   style="letter-spacing: 2px; font-size: 0.65rem;">Fecha de nacimiento (opcional)</label>
                            <input type="date" th:field="*{fechaNacimiento}"
                                   class="form-control form-control-sm rounded-0">
                        </div>
                    </div>

                    <!-- Checkbox aceptación de condiciones (OBLIGATORIO) -->
                    <div class="mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox"
                                   th:field="*{aceptaCondiciones}"
                                   th:classappend="${#fields.hasErrors('aceptaCondiciones')} ? 'is-invalid' : ''"
                                   id="aceptaCondiciones">
                            <label class="form-check-label small" for="aceptaCondiciones">
                                Acepto los
                                <a th:href="@{/condiciones}" target="_blank">términos y condiciones</a>
                                de JPS-HPA-CGS *
                            </label>
                            <div class="invalid-feedback" th:errors="*{aceptaCondiciones}"></div>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-dark text-uppercase"
                                style="letter-spacing: 3px; font-size: 0.75rem; padding: 12px;">
                            Crear cuenta
                        </button>
                    </div>

                </form>

                <p class="text-center small" style="color: #aaa; font-size: 0.75rem; letter-spacing: 1px;">
                    ¿Ya tienes cuenta?
                    <a th:href="@{/login}" class="text-dark">Inicia sesión</a>
                </p>

            </div>
        </div>
    </div>
</main>

<footer class="text-center py-4 border-top">
    <p class="small text-uppercase mb-0" style="letter-spacing: 3px; color: #aaa;">
        &copy; 2026 JPS-HPA-CGS Global
    </p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
