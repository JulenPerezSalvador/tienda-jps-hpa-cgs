<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head-comun(titulo='Coleccion - ' + ${categoria.nombre})}"></head>
<body>
<div th:replace="~{fragments/navegacion :: menu-principal}"></div>

<main class="container my-5 py-5" th:if="${categoria != null}">
    <div class="text-center mb-5">
        <h6 class="text-uppercase mb-2" style="letter-spacing: 5px; color: #8e8e8e;">Colección Privada</h6>
        <h1 class="display-4 fw-light" th:text="${categoria.nombre}" style="font-family: 'Cormorant Garamond', serif;"></h1>
        <p class="lead text-muted mx-auto" style="max-width: 700px;" th:text="${categoria.descripcion}"></p>
    </div>

    <div class="row g-4 mb-5">

        <div th:each="producto : ${categoria.productos}" class="col-12 mb-5">
            <div class="row align-items-center justify-content-center">

                <div class="col-md-5 text-center">
                    <div class="product-card" style="border: none;">
                        <div class="product-image-wrapper mb-3">
                            <img th:src="@{${producto.imagen != null ? producto.imagen : '/imagenes/categorias/carlos.jpg'}}" alt="Producto" class="img-fluid" style="max-width: 300px;">
                        </div>
                        <div class="product-info">
                            <p class="product-category text-muted small mb-1" th:text="${producto.marca.nombre}"></p>
                            <p class="product-name fw-bold fs-5 mb-1" th:text="${producto.nombre}"></p>
                            <p class="fw-bold mb-3" th:text="${producto.precio} + ' €'"></p>
                            <a th:href="@{/productos/{id}/{n}(id=${producto.id}, n=${producto.nombre})}" class="btn-luxury py-2 px-3" style="font-size: 0.6rem;">DETALLE</a>
                        </div>
                    </div>
                </div>

                <div class="col-md-5 text-start px-md-4 mt-4 mt-md-0">
                    <h5 class="text-uppercase mb-3" style="letter-spacing: 2px;">Descripción y detalles</h5>
                    <p class="text-muted" th:text="${producto.descripcion}">
                        Aquí aparecerá la descripción del producto guardada en la base de datos.
                    </p>
                </div>

            </div>
            <hr class="mt-5 text-muted" th:if="${!productoStat.last}" style="opacity: 0.1;">
        </div>

        <div th:if="${#lists.isEmpty(categoria.productos)}" class="col-12 text-center py-5">
            <p class="text-muted">Próximamente disponible.</p>
        </div>

    </div>

    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
        <a th:href="@{/productos}" class="btn btn-outline-dark btn-lg rounded-0 px-5">VOLVER AL LISTADO</a>
    </div>
</main>

<footer class="text-center py-5 border-top">
    <p class="small text-uppercase" style="letter-spacing: 3px;">&copy; 2026 JPS-HPA-CGS</p>
</footer>
</body>
</html>
