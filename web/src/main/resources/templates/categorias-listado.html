<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head-comun(titulo='Nuestras Colecciones')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navegacion :: menu-principal}"></div>

<main class="container my-5">
    <h2 class="text-center text-uppercase fw-light mb-5">Nuestras Colecciones</h2>

    <div class="row g-4">
        <div th:each="cat : ${categorias}" class="col-12 col-md-6 col-lg-4">
            <div class="card h-100 border-0 shadow-sm overflow-hidden tarjeta-hover">
                <img th:src="${cat.imagen != null and !cat.imagen.isEmpty()} ? @{'/imagenes/categorias/' + ${cat.imagen}} : @{/imagenes/categorias/foto-equipo.jpg}"
                     class="card-img-top img-producto-card" th:alt="${cat.nombre}">

                <div class="card-body text-center p-4">
                    <h3 class="h5 text-uppercase fw-bold mb-3" th:text="${cat.nombre}"></h3>
                    <p class="card-text text-muted mb-4" th:text="${cat.descripcion}"></p>
                    <a th:href="@{/categorias/{id}(id=${cat.id})}" class="btn-luxury">VER COLECCIÓN</a>
            </div>
        </div>
    </div>
</main>

<footer class="text-center py-4 border-top bg-dark text-white mt-auto">
    <div class="container">
        <small>&copy; 2026 Tienda JPS-HPA-CGS. Todos los derechos reservados.</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
