<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head-comun(titulo=${producto != null ? producto.nombre : 'Detalle'})}"></head>
<body>
<div th:replace="~{fragments/navegacion :: menu-principal}"></div>

<main class="container my-5" th:if="${producto != null}">
    <div class="row gx-5 align-items-center">
        <div class="col-md-6 mb-4 mb-md-0">
            <img th:src="@{${producto.imagen != null ? producto.imagen : '/imagenes/categorias/carlos.jpg'}}"
                 class="img-fluid shadow-sm" alt="Producto">
        </div>

        <div class="col-md-6">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-2">
                    <li class="breadcrumb-item"><a th:href="@{/productos}" class="text-dark">Productos</a></li>
                    <li class="breadcrumb-item active" th:text="${producto.marca.nombre}"></li>
                </ol>
            </nav>
            <h1 class="display-5 text-uppercase fw-bold mb-3" th:text="${producto.nombre}"></h1>
            <p class="text-muted mb-4" th:text="'EAN: ' + ${producto.codigoEan}"></p>

            <div class="mb-4">
                <h2 class="h3 fw-bold" th:text="${producto.precio} + ' €'"></h2>
            </div>

            <p class="lead text-muted mb-5" th:text="${producto.descripcion}"></p>

            <div class="d-grid gap-2 d-md-flex">
                <a th:href="@{/productos}" class="btn btn-outline-dark btn-lg rounded-0 px-5">VOLVER AL LISTADO</a>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
